<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schularbeitenplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: gleicher Kopf wie Portal und Stundenplan; darunter eine große Karte für die nächste Schularbeit
   (Datum, Countdown, Stunde laut Stundenplan) und die Liste aller Termine. */
:root {
    --bg: #f1f4fb; --card: #ffffff; --ink: #0f172a; --muted: #55627c; --line: #dfe5f1;
    --soft: #f6f8fd; --brand: #1e3a8a; --dot: rgba(148,163,184,0.24);
    --head-a: #0b1533; --head-b: #1e2f6b; --head-c: #3b2a82;
    --ok: #047857; --warn: #b45309; --focus: #f59e0b; --gelb: #fde047; --gelb-ink: #713f12;
    --shadow: 0 2px 8px rgba(30,58,138,0.07), 0 1px 3px rgba(30,58,138,0.04);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --radius: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #070c18; --card: #101a2e; --ink: #e5eaf5; --muted: #9aa6bd; --line: #1f2c47;
    --soft: #0b1424; --brand: #93b0ff; --dot: rgba(40,58,96,0.75);
    --head-a: #040814; --head-b: #101c45; --head-c: #2a1d63;
    --ok: #34d399; --warn: #fbbf24; --focus: #fbbf24;
    --shadow: 0 2px 8px rgba(0,0,0,0.35);
    color-scheme: dark;
} }
:root[data-theme="dark"] {
    --bg: #070c18; --card: #101a2e; --ink: #e5eaf5; --muted: #9aa6bd; --line: #1f2c47;
    --soft: #0b1424; --brand: #93b0ff; --dot: rgba(40,58,96,0.75);
    --head-a: #040814; --head-b: #101c45; --head-c: #2a1d63;
    --ok: #34d399; --warn: #fbbf24; --focus: #fbbf24;
    --shadow: 0 2px 8px rgba(0,0,0,0.35);
    color-scheme: dark;
}
.fc { --fc: var(--fc-l); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fc { --fc: var(--fc-d); } }
:root[data-theme="dark"] .fc { --fc: var(--fc-d); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { font-family: var(--font); font-size: 15px; line-height: 1.55; color: var(--ink); background: var(--bg);
       background-image: radial-gradient(circle, var(--dot) 0.85px, transparent 0.85px); background-size: 22px 22px; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 1040px; margin: 0 auto; }

/* ── Kopf ── */
.top { background: linear-gradient(135deg, var(--head-a) 0%, var(--head-b) 55%, var(--head-c) 100%); color: #fff; padding-block: 1.1rem 1.3rem; position: relative; overflow: hidden; }
.topnav { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem 0.5rem; margin-bottom: 1.1rem; }
.topnav a.nav { font: 600 0.84rem var(--font); color: rgba(255,255,255,0.86); text-decoration: none; padding: 0.38rem 0.85rem; border-radius: 999px; border: 1px solid transparent; }
.topnav a.nav:hover { background: rgba(255,255,255,0.14); }
.topnav a.nav[aria-current="page"] { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.28); color: #fff; }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.9rem 1.5rem; flex-wrap: wrap; }
.top h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.7px; line-height: 1.15; }
.top .sub { font-size: 0.88rem; opacity: 0.8; margin-top: 0.3rem; font-variant-numeric: tabular-nums; }
.icon-btn { width: 2.45rem; height: 2.45rem; flex: none; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; }
.icon-btn:hover { background: rgba(255,255,255,0.2); }
.icon-btn svg { width: 1.1rem; height: 1.1rem; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

main { padding-block: 1.5rem 4rem; }
section + section { margin-top: 1.8rem; }
h2.sec { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.7rem; }

/* ── Karten ── */
.sa { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.3rem 1.2rem; align-items: start;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.15rem 1.3rem 1.2rem 1.5rem; }
.sa::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--fc); }
.sa.next { background: linear-gradient(135deg, color-mix(in srgb, var(--fc) 13%, var(--card)), var(--card) 70%); border-color: color-mix(in srgb, var(--fc) 40%, var(--line)); }
.dat { grid-row: 1 / span 3; width: 4.6rem; text-align: center; overflow: hidden; border-radius: 12px; background: var(--card); border: 1px solid color-mix(in srgb, var(--fc) 45%, var(--line)); border-top: 5px solid var(--fc); }
.dat b { display: block; font-size: 2rem; font-weight: 800; line-height: 1.1; padding-top: 0.3rem; font-variant-numeric: tabular-nums; }
.dat span { display: block; padding: 0 0 0.35rem; font: 700 0.7rem var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.sa-top { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem 0.8rem; }
.sa .fach { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.4px; line-height: 1.15; }
.cd { font: 700 0.78rem var(--mono); padding: 0.15rem 0.7rem; border-radius: 999px; background: var(--ink); color: var(--card); white-space: nowrap; }
.cd.bald { background: var(--gelb); color: var(--gelb-ink); }
.wt { font-size: 1rem; font-weight: 600; }
.unt { font-size: 0.9rem; color: var(--muted); }
.unt b { color: var(--ink); font-weight: 600; }
.stoff { font-size: 0.9rem; }
.lnk { display: inline-block; margin-top: 0.35rem; font-size: 0.86rem; font-weight: 600; color: var(--brand); text-decoration: none; }
.lnk:hover { text-decoration: underline; }
.simu { margin-top: 0.5rem; font-size: 0.78rem; color: var(--warn); font-weight: 600; }

/* ── Liste ── */
.liste { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.row { position: relative; overflow: hidden; display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) auto; gap: 0.2rem 0.9rem; align-items: center; padding: 0.65rem 1rem 0.65rem 1.2rem;
       background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--fc); }
.row .d { font: 700 0.86rem var(--mono); font-variant-numeric: tabular-nums; }
.row .d small { display: block; color: var(--muted); font-weight: 500; font-size: 0.7rem; }
.row .f b { font-size: 1.05rem; } .row .f span { display: block; font-size: 0.82rem; color: var(--muted); }
.row.vorbei { opacity: 0.6; }
.row.naechste { border-color: color-mix(in srgb, var(--fc) 50%, var(--line)); }
.leer { background: var(--card); border: 1px dashed var(--muted); border-radius: var(--radius); padding: 1.6rem; text-align: center; color: var(--muted); }
.hinweis { margin-top: 1.4rem; font-size: 0.82rem; color: var(--muted); max-width: 46rem; }

@media (max-width: 600px) {
    .top h1 { font-size: 1.7rem; }
    .sa { padding: 1rem 1rem 1.1rem 1.2rem; gap: 0.3rem 0.9rem; } .dat { width: 4rem; } .dat b { font-size: 1.7rem; } .sa .fach { font-size: 1.45rem; }
    .row { grid-template-columns: 3.6rem minmax(0, 1fr); } .row .cd { grid-column: 2; justify-self: start; }
}
</style>
</head>
<body>
<header class="top gutter">
    <div class="col">
        <nav class="topnav" aria-label="Hauptmenü">
            <a class="nav" href="index.html">Lernseiten</a>
            <a class="nav" href="stundenplan.html">Stundenplan</a>
            <a class="nav" href="schularbeiten.html" aria-current="page">Schularbeiten</a>
        </nav>
        <div class="top-row">
            <div>
                <h1>Schularbeitenplan</h1>
                <p class="sub" id="sub">Lädt …</p>
            </div>
            <button class="icon-btn" id="theme-btn" type="button" aria-label="Dunkles Design einschalten" title="Design wechseln"></button>
        </div>
    </div>
</header>

<main class="gutter" id="inhalt">
<div class="col">
    <section aria-labelledby="h-next">
        <h2 class="sec" id="h-next">Nächste Schularbeit</h2>
        <div id="naechste"></div>
    </section>
    <section aria-labelledby="h-alle">
        <h2 class="sec" id="h-alle">Alle Termine</h2>
        <ol class="liste" id="liste"></ol>
    </section>
    <p class="hinweis">Die Termine werden von Hand eingetragen, maßgeblich ist immer der Plan der Schule. Die Uhrzeit ist die Stunde des Fachs laut Stundenplan.</p>
</div>
</main>

<script src="shared/stundenplan.js"></script>
<script src="shared/schularbeiten.js"></script>
<script src="shared/live.js"></script>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var store = { get: function (k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } },
              set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ── Design (hell/dunkel), gemeinsam mit Portal und Lernseiten ── */
var root = document.documentElement, tbtn = $('theme-btn');
var ICON = {
    moon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>'
};
var isDark = function () { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function themeUi() {
    var d = isDark();
    tbtn.innerHTML = d ? ICON.sun : ICON.moon;
    tbtn.setAttribute('aria-label', d ? 'Helles Design einschalten' : 'Dunkles Design einschalten');
    tbtn.title = d ? 'Helles Design' : 'Dunkles Design';
}
var savedTheme = store.get('lern-theme', null);
if (savedTheme === 'dark' || savedTheme === 'light') root.setAttribute('data-theme', savedTheme);
themeUi();
tbtn.addEventListener('click', function () { var t = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', t); store.set('lern-theme', t); themeUi(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeUi); } catch (e) {}

var plan = window.STUNDENPLAN, SA = window.SCHULARBEITEN || [], L = window.LernLive;
if (!plan || !L) { $('sub').textContent = 'Die Daten konnten nicht geladen werden. Bitte die Seite neu laden.'; return; }

var MONAT = ['Jänner', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
var KURZ = ['Jän', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
var fcStyle = function (code) { var f = plan.faecher[code] || {}; return 'style="--fc-l:' + (f.farbe || '#64748b') + ';--fc-d:' + (f.farbeDunkel || '#94a3b8') + '"'; };
var tageBis = function (datum, heute) { return Math.round((Date.parse(datum + 'T00:00:00Z') - Date.parse(heute + 'T00:00:00Z')) / 86400000); };
var countdown = function (n) { return n === 0 ? 'heute' : n === 1 ? 'morgen' : n > 1 ? 'in ' + n + ' Tagen' : 'vorbei'; };
var teile = function (d) { return { t: +d.slice(8, 10), m: +d.slice(5, 7) - 1, j: d.slice(0, 4) }; };
var langDatum = function (d) { var p = teile(d); return L.LANG[L.dayKey(d)] + ', ' + p.t + '. ' + MONAT[p.m] + ' ' + p.j; };
var tag = function (e) { return L.dayKey(e.datum); };

// Die Stunde(n) des Fachs an diesem Tag laut Stundenplan (leer, wenn der Tag außerhalb des Plans liegt)
function stunden(e) {
    var list = (L.bloecke(plan, e.datum) || []).filter(function (b) { return b.fach === e.fach && b.status !== 'entfall'; });
    return list.map(function (b) { return '<b>' + b.zeitVon + '–' + b.zeitBis + '</b> · ' + esc(L.lehrerText(plan, b.gruppen, false)) + ' · Raum ' + b.gruppen.map(function (g) { return esc(g.raum || '–'); }).join(' / '); });
}
function karte(e, heute) {
    var n = tageBis(e.datum, heute), p = teile(e.datum), f = plan.faecher[e.fach] || {}, st = stunden(e);
    return '<article class="sa next fc" ' + fcStyle(e.fach) + '><div class="dat"><b>' + p.t + '</b><span>' + KURZ[p.m] + '</span></div>' +
        '<div class="sa-top"><span class="fach">' + esc(e.fach) + '</span><span class="cd' + (n <= 7 ? ' bald' : '') + '">' + countdown(n) + '</span></div>' +
        '<div class="wt">' + esc(langDatum(e.datum)) + '</div>' +
        '<div>' + (st.length ? '<div class="unt">Stunde laut Stundenplan: ' + st.join('<br>') + '</div>' : '') +
        (e.stoff ? '<div class="stoff">Stoff: ' + esc(e.stoff) + '</div>' : '') +
        (f.portal ? '<a class="lnk" href="index.html?fach=' + encodeURIComponent(f.portal) + '">Lernseiten zu ' + esc(e.fach) + ' →</a>' : '') + '</div></article>';
}
function zeile(e, heute, istNaechste) {
    var n = tageBis(e.datum, heute), p = teile(e.datum), st = stunden(e);
    var zeit = st.length ? st[0].replace(/<[^>]+>/g, '').split(' · ')[0] : '';
    return '<li class="row fc' + (n < 0 ? ' vorbei' : '') + (istNaechste ? ' naechste' : '') + '" ' + fcStyle(e.fach) + '>' +
        '<div class="d">' + String(p.t).padStart(2, '0') + '.' + String(p.m + 1).padStart(2, '0') + '.<small>' + p.j + '</small></div>' +
        '<div class="f"><b>' + esc(e.fach) + '</b><span>' + esc(L.LANG[tag(e)]) + (zeit ? ' · ' + zeit : '') + (e.titel ? ' · ' + esc(e.titel) : '') + '</span></div>' +
        '<span class="cd' + (n >= 0 && n <= 7 ? ' bald' : '') + '">' + countdown(n) + '</span></li>';
}
function render() {
    var heute = L.status(plan, L.jetzt()).datum;
    var simu = L.simuliert() ? '<p class="simu">Testzeit: ' + L.ddmm(heute) + heute.slice(0, 4) + ' (aus der Adresse)</p>' : '';
    var liste = SA.slice().sort(function (a, b) { return a.datum.localeCompare(b.datum); });
    var kommende = liste.filter(function (e) { return e.datum >= heute; });
    $('sub').textContent = plan.klasse + ' · ' + (kommende.length ? kommende.length + (kommende.length === 1 ? ' Schularbeit' : ' Schularbeiten') + ' ausstehend' : (liste.length ? 'alle Schularbeiten vorbei' : 'noch keine Termine'));
    var naechste = kommende[0];
    $('naechste').innerHTML = naechste ? karte(naechste, heute) + simu : '<div class="leer">' + (liste.length ? 'Keine weitere Schularbeit eingetragen.' : 'Noch keine Schularbeiten eingetragen.') + '</div>' + simu;
    $('liste').innerHTML = liste.map(function (e) { return zeile(e, heute, e === naechste); }).join('') || '<li class="leer">Noch keine Termine.</li>';
}
render();
setInterval(render, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
