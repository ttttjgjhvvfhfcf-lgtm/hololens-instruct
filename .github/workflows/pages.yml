name: Deploy Lernportal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'lernseiten/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Hochladen und Veröffentlichen sind getrennte Jobs (Standardmuster von GitHub): In einem einzigen Job suchte
  # der Deploy-Schritt das gerade hochgeladene Paket zu früh und fand es nicht ("Found 0 artifact(s)").
  # Nun lässt sich ein fehlgeschlagener Deploy einzeln wiederholen, ohne erneut hochzuladen.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Lernportal
        uses: actions/upload-pages-artifact@v3
        with:
          path: lernseiten

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kurz warten, bis GitHub das Paket auflistet
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
